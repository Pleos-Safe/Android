name: Set up Android build
description: Install the project toolchain and configure the Gradle cache and wrapper validation.

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '25'

    - name: Set up Android SDK 37
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: 'platform-tools platforms;android-37.0'
        log-accepted-android-sdk-licenses: 'false'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic
        cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch }}
        validate-wrappers: 'true'
        build-scan-publish: 'false'
        dependency-graph: disabled
