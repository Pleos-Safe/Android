<svg xmlns="http://www.w3.org/2000/svg" width="400" height="486" viewBox="0 0 400 486" role="img" aria-labelledby="title desc">
  <title id="title">차곡차곡의 주요 모듈과 컴파일 의존 방향</title>
  <desc id="desc">앱은 main을, main은 nav를 참조한다. 컬렉션과 강화는 카드 UI와 도메인을 참조한다. 데이터와 차량 모듈은 도메인 인터페이스를 구현하고 데이터 모듈은 데이터베이스를 사용한다.</desc>
