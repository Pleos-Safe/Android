    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="m1 1 6 3-6 3" fill="none" stroke="#55728b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      .module { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 17px; font-weight: 650; fill: #152d41; }
      .caption { font-size: 13px; fill: #425b71; }
      .link { fill: none; stroke: #55728b; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>
