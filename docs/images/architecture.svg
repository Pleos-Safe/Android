<svg xmlns="http://www.w3.org/2000/svg" width="960" height="472" viewBox="0 0 960 472" role="img" aria-labelledby="title desc">
  <title id="title">차곡차곡의 주요 모듈과 컴파일 의존 방향</title>
  <desc id="desc">화살표는 코드를 사용하는 쪽에서 참조하는 쪽을 향한다. app은 feature:main을, main은 feature:nav를 호출한다. 컬렉션과 강화는 core:card-ui를 공유하고 core:domain의 계약을 사용한다. core:data와 core:vehicle은 이 계약을 구현하며 core:data는 core:database를 사용한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="m1 1 6 3-6 3" fill="none" stroke="#55728b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      .module { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 21px; font-weight: 650; fill: #152d41; }
      .caption { font-size: 15px; fill: #425b71; }
      .icon { fill: none; stroke: #396886; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .link { fill: none; stroke: #55728b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="470" rx="16" fill="#f5f8fa" stroke="#cfdae1"/>

  <!-- App composition -->
  <rect x="17" y="17" width="926" height="100" rx="11" fill="#122d44"/>
  <g font-size="21" font-weight="650" fill="#f5faff">
    <text x="48" y="59" class="module" style="fill:#f5faff">:app</text>
    <text x="362" y="59" class="module" style="fill:#f5faff">:feature:main</text>
    <text x="688" y="59" class="module" style="fill:#f5faff">:feature:nav</text>
  </g>
  <g font-size="15" fill="#c9dce8">
    <text x="48" y="86">앱 진입 · Hilt 조립</text>
    <text x="362" y="86">탭별 백 스택 · 주행 제한</text>
    <text x="688" y="86">Navigation 3 · NavDisplay</text>
  </g>
  <g fill="none" stroke="#91c6d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 65h55m-7-6 7 6-7 6"/>
    <path d="M593 65h55m-7-6 7 6-7 6"/>
  </g>

  <!-- Source references, not runtime data flow -->
  <text x="28" y="155" font-size="17" fill="#294457" font-weight="650">핵심 모듈 의존성</text>
  <path d="M668 149h27" class="link"/>
  <text x="708" y="154" font-size="14" fill="#425b71">화살표 끝이 참조하는 모듈</text>

  <path d="M269 255h68" class="link"/>
  <path d="M624 232h-35" class="link"/>
  <path d="M463 352v-24" class="link"/>
  <path d="M782 278v70" class="link"/>

  <rect x="26" y="197" width="243" height="116" rx="12" fill="#ffffff" stroke="#b4c8d5"/>
  <g class="icon" transform="translate(44 211)">
    <rect x="1" y="4" width="15" height="12" rx="2"/><path d="M4 1h13q2 0 2 2v10"/>
  </g>
  <text x="73" y="225" font-size="16" fill="#315872" font-weight="600">카드 화면</text>
  <text x="44" y="257" class="module" style="font-size:18px">:feature:collection</text>
  <text x="44" y="284" class="module" style="font-size:18px">:feature:forge</text>

  <rect x="345" y="186" width="236" height="138" rx="13" fill="#e1f3ef" stroke="#52988b" stroke-width="1.5"/>
  <text x="365" y="213" font-size="14" font-weight="650" fill="#216c62">KOTLIN / JVM</text>
  <text x="365" y="248" class="module" style="font-size:24px;fill:#104c45">:core:domain</text>
  <text x="365" y="278" class="caption" style="fill:#285b53">Repository 인터페이스</text>
  <text x="365" y="301" class="caption" style="fill:#285b53">강화 확률 · 주행 적립 정책</text>

  <rect x="628" y="187" width="308" height="91" rx="12" fill="#ffffff" stroke="#b4c8d5"/>
  <g class="icon" transform="translate(648 208)">
    <path d="m0 7 9-5 9 5-9 5zM0 12l9 5 9-5M0 17l9 5 9-5"/>
  </g>
  <text x="681" y="226" class="module">:core:data</text>
  <text x="649" y="255" class="caption">카드·포인트 저장소 구현</text>

  <rect x="26" y="354" width="243" height="89" rx="12" fill="#ffffff" stroke="#b4c8d5"/>
  <text x="45" y="391" class="module">:core:card-ui</text>
  <text x="45" y="421" class="caption">카드 프레임 · 포일 렌더링</text>
  <path d="M147 313v36" class="link"/>

  <rect x="345" y="354" width="236" height="89" rx="12" fill="#ffffff" stroke="#b4c8d5"/>
  <g class="icon" transform="translate(362 375)">
    <path d="m1 10 3-6h11l3 6M2 10h15v6H2zM4 16v2m11-2v2M5 12h2m5 0h2"/>
  </g>
  <text x="392" y="391" class="module">:core:vehicle</text>
  <text x="365" y="421" class="caption">Car API · Pleos 위치·내비 SDK</text>

  <rect x="628" y="354" width="308" height="89" rx="12" fill="#eaf0f4" stroke="#afc1ce"/>
  <g class="icon" transform="translate(648 375)">
    <ellipse cx="8.5" cy="3" rx="7" ry="3"/><path d="M1.5 3v10c0 4 14 4 14 0V3M1.5 8c0 4 14 4 14 0"/>
  </g>
  <text x="681" y="391" class="module">:core:database</text>
  <text x="649" y="421" class="caption">Room · SQLCipher · Keystore</text>
</svg>
